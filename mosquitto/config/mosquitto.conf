# pid_file /mosquitto/pid/mosquitto.pid

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
persistent_client_expiration 1d

max_connections -1

max_inflight_messages 100

max_queued_messages 1000

max_packet_size 10485760

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
log_type websockets

log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z

listener 1883 0.0.0.0
protocol mqtt
# allow_anonymous true  (habilitado en desarrollo)

listener 9001 0.0.0.0
protocol websockets

# MQTT con TLS (descomentar para producción)
# listener 8883 0.0.0.0
# protocol mqtt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# cafile /mosquitto/certs/ca.crt
# require_certificate false
# use_identity_as_username false

allow_anonymous true
sys_interval 10
# En producción: descomentar para autenticación
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# pattern: sensor/+/+/data
# pattern: actuator/+/command
# pattern: system/+/event

websockets_log_level warning

